<text x="40" y="44" class="h1" text-anchor="start">M02 · Obter material identificável para a supervisão editorial externa</text>
<text x="40" y="72" class="sub" text-anchor="start">Lucas Roberto Boccia dos Santos (22.123.012-1) · CI02/T02 · O06–O07 pelo editor, O04 para item faltante; sai para O09/O10</text>
<text x="40" y="94" class="sub" text-anchor="start">Proposta para revisão individual · notação: CC8122-Molic Parte A, slides 6–15; Parte B, slides 3–5</text>
