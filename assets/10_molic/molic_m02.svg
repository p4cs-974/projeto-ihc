<text x="214" y="856" class="stitle"><tspan class="sid">c2</tspan> · Conferir corte a encaminhar</text>
<text x="726" y="856" class="tag" text-anchor="end">O06 · O07</text>
<text x="214" y="893" class="dname" text-anchor="start">conferir identificação {</text>
<text x="228" y="914" class="dline" text-anchor="start">d: id do candidato S16, partida S01, tempo S02,</text>
<text x="249" y="935" class="dline" text-anchor="start">vídeo de origem S03 }</text>
<text x="214" y="956" class="dname" text-anchor="start">conferir referências temporais {</text>
<text x="228" y="977" class="dline" text-anchor="start">d: relógio do jogo S18, instante no arquivo S19,</text>
<text x="249" y="998" class="dline" text-anchor="start">intervalo S20, duração do corte S21 }</text>
<text x="214" y="1019" class="dname" text-anchor="start">decidir inclusão {</text>
<text x="228" y="1040" class="dline" text-anchor="start">d+u: candidato S16 na seleção S23 (incluir ou retirar) }</text>
<text x="214" y="1061" class="dname" text-anchor="start">ver vídeo para obtenção {</text>
<text x="228" y="1082" class="dline" text-anchor="start">d: MP4 S27 do corte, tamanho S33 }</text>
</g>
