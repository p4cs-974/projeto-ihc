<text x="214" y="257" class="stitle"><tspan class="sid">c1</tspan> · Preparar material para a supervisão</text>
<text x="726" y="257" class="tag" text-anchor="end">O06 · O07</text>
<text x="214" y="294" class="dname" text-anchor="start">conferir identificação da seleção {</text>
<text x="228" y="315" class="dline" text-anchor="start">d: lista(candidato S16: id, partida S01, tempo S02,</text>
<text x="249" y="336" class="dline" text-anchor="start">tipo S17, relógio S18, intervalo S20),</text>
<text x="249" y="357" class="dline" text-anchor="start">quantidade S24, duração somada S25 }</text>
<text x="214" y="378" class="dname" text-anchor="start">retirar item {</text>
<text x="228" y="399" class="dline" text-anchor="start">d+u: seleção S23 }</text>
<text x="214" y="420" class="dname" text-anchor="start">distinguir saídas {</text>
<text x="228" y="441" class="dline" text-anchor="start">d: CSV S26 com referências da seleção, exige seleção não vazia;</text>
<text x="249" y="462" class="dline" text-anchor="start">MP4 S27 obtido por corte, sem exigir seleção }</text>
<text x="214" y="483" class="dname" text-anchor="start">planejar obtenção {</text>
<text x="228" y="504" class="dline" text-anchor="start">d: tamanho S33 de cada MP4: conhecido, estimado ou indisponível;</text>
<text x="249" y="525" class="dline" text-anchor="start">soma S34 só como total se todos forem conhecidos }</text>
<text x="214" y="546" class="dname" text-anchor="start">reconhecer limites {</text>
<text x="228" y="567" class="dline" text-anchor="start">d: seleção preservada só nesta sessão S29;</text>
<text x="249" y="588" class="dline" text-anchor="start">seleção não é aprovação; decisão S31 fica fora do sistema }</text>
</g>
<g id="c2" data-kind="scene">
<rect x="200" y="829" width="540" height="290" rx="14" fill="#fff" stroke="#1f2a33" stroke-width="2"/>
