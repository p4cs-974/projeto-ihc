<text x="726" y="1276" class="tag" text-anchor="end">O04 · O06</text>
<text x="214" y="1313" class="dname" text-anchor="start">restringir consulta {</text>
<text x="228" y="1334" class="dline" text-anchor="start">d+u: critérios S22: partida S01, tempo S02, tipo de lance S17 }</text>
<text x="214" y="1355" class="dname" text-anchor="start">ver candidatos {</text>
<text x="228" y="1376" class="dline" text-anchor="start">d: lista(candidato S16: tipo S17, relógio S18, tempo S02,</text>
<text x="249" y="1397" class="dline" text-anchor="start">indicação de já estar na seleção S23) }</text>
<text x="214" y="1418" class="dname" text-anchor="start">reconhecer seleção mantida {</text>
<text x="228" y="1439" class="dline" text-anchor="start">d: quantidade selecionada S24, inclusive fora da consulta }</text>
</g>
