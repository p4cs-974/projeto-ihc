<text x="214" y="1050" class="stitle"><tspan class="sid">c3</tspan> · Conferir a seleção e as saídas</text>
<text x="726" y="1050" class="tag" text-anchor="end">O06 · O07</text>
<text x="214" y="1087" class="dname" text-anchor="start">ver seleção {</text>
<text x="228" y="1108" class="dline" text-anchor="start">d: lista(candidato S16 em S23: S01, S02, S17, S18),</text>
<text x="249" y="1129" class="dline" text-anchor="start">quantidade S24, duração somada S25 }</text>
<text x="214" y="1150" class="dname" text-anchor="start">retirar item {</text>
<text x="228" y="1171" class="dline" text-anchor="start">d+u: seleção S23 }</text>
<text x="214" y="1192" class="dname" text-anchor="start">planejar obtenção {</text>
<text x="228" y="1213" class="dline" text-anchor="start">d: tamanho S33 de cada MP4: conhecido, estimado ou indisponível;</text>
<text x="249" y="1234" class="dline" text-anchor="start">soma S34 só como total se todos forem conhecidos }</text>
<text x="214" y="1255" class="dname" text-anchor="start">distinguir saídas {</text>
<text x="228" y="1276" class="dline" text-anchor="start">d: CSV S26 com referências da seleção, exige seleção não vazia;</text>
<text x="249" y="1297" class="dline" text-anchor="start">MP4 S27 obtido por corte, sem exigir seleção }</text>
</g>
