<text x="726" y="630" class="tag" text-anchor="end">O05 · O06</text>
<text x="214" y="667" class="dname" text-anchor="start">ver origem {</text>
<text x="228" y="688" class="dline" text-anchor="start">d: partida S01, tempo S02, vídeo de origem S03 }</text>
<text x="214" y="709" class="dname" text-anchor="start">ver corte {</text>
<text x="228" y="730" class="dline" text-anchor="start">d: tipo sugerido S17, relógio do jogo S18, instante no</text>
<text x="249" y="751" class="dline" text-anchor="start">arquivo S19, intervalo S20, duração do corte S21 }</text>
<text x="214" y="772" class="dname" text-anchor="start">decidir inclusão {</text>
<text x="228" y="793" class="dline" text-anchor="start">d+u: candidato S16 na seleção S23 (incluir ou retirar) }</text>
<text x="214" y="814" class="dname" text-anchor="start">ver vídeo para obtenção {</text>
<text x="228" y="835" class="dline" text-anchor="start">d: MP4 S27 do corte, tamanho S33 }</text>
</g>
