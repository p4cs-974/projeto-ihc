<text x="214" y="257" class="stitle"><tspan class="sid">c1</tspan> · Localizar candidatos</text>
<text x="726" y="257" class="tag" text-anchor="end">O04 · O08</text>
<text x="214" y="294" class="dname" text-anchor="start">reconhecer alcance {</text>
<text x="228" y="315" class="dline" text-anchor="start">d: partida S01, tempo S02, tentativa S32 se identificável,</text>
<text x="249" y="336" class="dline" text-anchor="start">disponibilidade e limites dos resultados S12 }</text>
<text x="214" y="357" class="dname" text-anchor="start">restringir consulta {</text>
<text x="228" y="378" class="dline" text-anchor="start">d+u: critérios S22: partida, tempo, tipo de lance S17 }</text>
<text x="214" y="399" class="dname" text-anchor="start">ver candidatos {</text>
<text x="228" y="420" class="dline" text-anchor="start">d: lista(candidato S16: tipo S17, relógio S18, tempo S02) }</text>
<text x="214" y="441" class="dname" text-anchor="start">reconhecer contexto preservado {</text>
<text x="228" y="462" class="dline" text-anchor="start">d: referência de retomada S29, quantidade selecionada S24 }</text>
</g>
<g id="c2" data-kind="scene">
