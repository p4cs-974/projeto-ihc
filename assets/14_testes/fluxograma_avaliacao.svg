<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1320" viewBox="0 0 1400 1320" role="img" aria-labelledby="title desc">
<title id="title">Fluxograma da avaliação por observação de usuários — Equipe 16</title>
<desc id="desc">Fluxograma das fases do teste de usabilidade remoto da Equipe 16: preparação, piloto e ajustes, recrutamento em paralelo, sessão remota com consentimento, tarefas e tratamento de falhas de conexão ou reagendamento, retorno após sete dias, interpretação, consolidação, comparação com a Entrega 13, relato, vídeo ilustrativo e descarte ético.</desc>
<defs>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#152e43}
    .title{font-size:30px;font-weight:700}
    .sub{font-size:16px;fill:#425b70}
    .phase{font-size:15px;font-weight:700;fill:#176559;letter-spacing:0.4px}
    .phase-team{font-size:15px;font-weight:700;fill:#163d54;letter-spacing:0.4px}
    .card-title{font-size:18px;font-weight:700;fill:#152e43}
    .card-sub{font-size:14.5px;fill:#425b70}
    .diamond-txt{font-size:15.5px;font-weight:700;fill:#5c3d0e}
    .edge-lbl{font-size:14px;font-weight:700;fill:#152e43}
    .edge-warn{font-size:14px;font-weight:700;fill:#8a5a14}
    .edge-loop{font-size:13.5px;font-weight:700;fill:#176559}
    .pill-txt{font-size:14px;font-weight:700;fill:#ffffff}
    .note{font-size:14px;fill:#425b70}
    .note-b{font-size:14.5px;font-weight:700;fill:#176559}
    .arrow{fill:none;stroke:#48657a;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .arrow-warn{fill:none;stroke:#9a6d28;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .arrow-loop{fill:none;stroke:#176559;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .arrow-ext{fill:none;stroke:#9a6d28;stroke-width:2.5;stroke-dasharray:8 6;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 1 L10 5 L0 9 z" fill="#48657a"/>
  </marker>
  <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 1 L10 5 L0 9 z" fill="#9a6d28"/>
  </marker>
  <marker id="arr-loop" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 1 L10 5 L0 9 z" fill="#176559"/>
  </marker>
</defs>

<rect width="1400" height="1320" fill="#f7fafc"/>

<!-- Cabeçalho -->
<text x="50" y="46" class="title">Fluxograma da avaliação por observação de usuários</text>
<text x="50" y="74" class="sub">Entrega 14 · Equipe 16 · Versão: ihc-11.p4cs.com.br (commit 7405221) · Base: Barbosa e Silva (2010) e plano DECIDE</text>

<!-- Legenda -->
<rect x="910" y="24" width="16" height="16" rx="3" fill="#edf4f8" stroke="#b8ccd9" stroke-width="1.5"/>
<text x="934" y="37" class="note">Preparo e análise</text>
<rect x="1124" y="24" width="16" height="16" rx="3" fill="#e4f4ed" stroke="#7db69f" stroke-width="1.5"/>
<text x="1148" y="37" class="note">Sessão remota (U01–U03)</text>
<polygon points="918,54 927,63 918,72 909,63" fill="#fffaf0" stroke="#c99846" stroke-width="1.5"/>
<text x="934" y="68" class="note">Decisão / contingência</text>
<line x1="1124" y1="63" x2="1160" y2="63" class="arrow-ext"/>
<text x="1170" y="68" class="note">Retorno (UT08, ≥ 7 dias)</text>

<!-- FASE 1: PREPARAÇÃO, PILOTO E RECRUTAMENTO -->
<rect x="50" y="102" width="1300" height="284" rx="14" fill="#edf4f8" stroke="#c8d9e6" stroke-width="1.5"/>
<text x="72" y="128" class="phase-team">FASE 1 · PREPARAÇÃO, TESTE PILOTO E RECRUTAMENTO · EQUIPE</text>

<!-- Linha 1: Planejamento -> Preparo técnico -> Piloto -> Decisão -->
<rect x="72" y="146" width="286" height="90" rx="12" fill="#ffffff" stroke="#b8ccd9" stroke-width="1.5"/>
<text x="90" y="174" class="card-title">1. Planejamento DECIDE</text>
<text x="90" y="197" class="card-sub">Fixar versão (7405221), metas</text>
<text x="90" y="217" class="card-sub">MQ/MU e cenários UT01–UT08.</text>

<line x1="358" y1="191" x2="394" y2="191" class="arrow" marker-end="url(#arr)"/>

<rect x="398" y="146" width="290" height="90" rx="12" fill="#ffffff" stroke="#b8ccd9" stroke-width="1.5"/>
<text x="416" y="174" class="card-title">2. Preparação técnica</text>
<text x="416" y="197" class="card-sub">Perfil limpo, mídia, downloads,</text>
<text x="416" y="217" class="card-sub">2 salas virtuais e recorte da aba.</text>

<line x1="688" y1="191" x2="724" y2="191" class="arrow" marker-end="url(#arr)"/>

<rect x="728" y="146" width="266" height="90" rx="12" fill="#ffffff" stroke="#b8ccd9" stroke-width="1.5"/>
<text x="746" y="174" class="card-title">3. Piloto interno (PIL01)</text>
<text x="746" y="197" class="card-sub">Pedro modera, Lucas anota e</text>
<text x="746" y="217" class="card-sub">Giovanni executa o roteiro.</text>

<line x1="994" y1="191" x2="1032" y2="191" class="arrow" marker-end="url(#arr)"/>

<!-- Decisão 1: Piloto ok? -->
<polygon points="1138,144 1240,191 1138,238 1036,191" fill="#fffaf0" stroke="#c99846" stroke-width="2"/>
<text x="1138" y="187" text-anchor="middle" class="diamond-txt">Piloto</text>
<text x="1138" y="207" text-anchor="middle" class="diamond-txt">validado?</text>

<!-- Não -> Ajustar roteiro -> volta para Piloto -->
<path d="M1138 238 V322 H998" class="arrow-warn" marker-end="url(#arr-warn)"/>
<text x="1152" y="286" class="edge-warn">Não</text>

<rect x="728" y="278" width="266" height="86" rx="12" fill="#ffffff" stroke="#c99846" stroke-width="1.5"/>
<text x="746" y="306" class="card-title">Ajustar roteiro e sala</text>
<text x="746" y="329" class="card-sub">Corrigir instruções, gabaritos ou</text>
<text x="746" y="349" class="card-sub">contingência e revalidar piloto.</text>

<line x1="861" y1="278" x2="861" y2="240" class="arrow-warn" marker-end="url(#arr-warn)"/>

<!-- Linha 2 esquerda: Recrutamento em paralelo -->
<rect x="72" y="278" width="540" height="86" rx="12" fill="#ffffff" stroke="#b8ccd9" stroke-width="1.5"/>
<text x="90" y="306" class="card-title">4. Recrutamento e agendamento (em paralelo)</text>
<text x="90" y="329" class="card-sub">Recrutar 3 adultos externos (2 P01 + 1 P03; proxies à parte), aplicar triagem</text>
<text x="90" y="349" class="card-sub">PRE01–PRE03, enviar instruções prévias e abrir a sala 15 min antes.</text>

<!-- Transições Fase 1 -> Fase 2 -->
<path d="M1240 191 H1306 V414" class="arrow" marker-end="url(#arr)"/>
<text x="1272" y="182" text-anchor="middle" class="edge-lbl">Sim</text>
<line x1="342" y1="364" x2="342" y2="414" class="arrow" marker-end="url(#arr)"/>

<rect x="524" y="392" width="352" height="24" rx="12" fill="#163d54"/>
<text x="700" y="409" text-anchor="middle" class="pill-txt">Piloto concluído + participante agendado</text>

<!-- FASE 2: COLETA DE DADOS (SESSÃO REMOTA E CONTINGÊNCIA) -->
<rect x="50" y="420" width="1300" height="430" rx="14" fill="#e4f4ed" stroke="#7db69f" stroke-width="2"/>
<text x="72" y="448" class="phase">FASE 2 · COLETA DE DADOS · SESSÃO REMOTA INDIVIDUAL (MODERADOR + OBSERVADOR)</text>

<!-- Badges U01-U03 -->
<rect x="1028" y="430" width="94" height="26" rx="13" fill="#176559"/>
<text x="1075" y="448" text-anchor="middle" class="pill-txt">U01 · P01</text>
<rect x="1132" y="430" width="94" height="26" rx="13" fill="#176559"/>
<text x="1179" y="448" text-anchor="middle" class="pill-txt">U02 · P01</text>
<rect x="1236" y="430" width="94" height="26" rx="13" fill="#176559"/>
<text x="1283" y="448" text-anchor="middle" class="pill-txt">U03 · P03</text>

<!-- Linha principal da sessão -->
<rect x="72" y="472" width="276" height="98" rx="12" fill="#ffffff" stroke="#8ec0ab" stroke-width="1.5"/>
<text x="90" y="498" class="card-title">5. Abertura e aceite</text>
<text x="90" y="520" class="card-sub">Explicar limites, registrar aceite</text>
<text x="90" y="539" class="card-sub">separado (gravação/vídeo) e</text>
<text x="90" y="558" class="card-sub">aplicar pré-teste (PRE04–PRE06).</text>

<line x1="348" y1="521" x2="384" y2="521" class="arrow" marker-end="url(#arr)"/>

<rect x="388" y="472" width="290" height="98" rx="12" fill="#ffffff" stroke="#8ec0ab" stroke-width="1.5"/>
<text x="406" y="498" class="card-title">6. Execução UT01–UT07</text>
<text x="406" y="520" class="card-sub">Ler cenário neutro, cronometrar,</text>
<text x="406" y="539" class="card-sub">observar sem ensinar caminho e</text>
<text x="406" y="558" class="card-sub">aplicar pós-tarefa (UT02/05/06).</text>

<line x1="678" y1="521" x2="716" y2="521" class="arrow" marker-end="url(#arr)"/>

<!-- Decisão 2: Falha de rede ou sala? -->
<polygon points="828,471 936,521 828,571 720,521" fill="#fffaf0" stroke="#c99846" stroke-width="2"/>
<text x="828" y="517" text-anchor="middle" class="diamond-txt">Falha de rede</text>
<text x="828" y="537" text-anchor="middle" class="diamond-txt">ou da sala?</text>

<!-- Não -> Conferência e pós-teste -->
<line x1="936" y1="521" x2="994" y2="521" class="arrow" marker-end="url(#arr)"/>
<text x="965" y="512" text-anchor="middle" class="edge-lbl">Não</text>

<rect x="998" y="472" width="330" height="98" rx="12" fill="#ffffff" stroke="#8ec0ab" stroke-width="1.5"/>
<text x="1016" y="498" class="card-title">7. Conferência e pós-teste</text>
<text x="1016" y="520" class="card-sub">Conferir CSV/MP4 (gravação pausada),</text>
<text x="1016" y="539" class="card-sub">fazer entrevista pós-teste e informar</text>
<text x="1016" y="558" class="card-sub">código e prazo de retirada.</text>

<!-- Sim -> Contingência remota -->
<line x1="828" y1="570" x2="828" y2="614" class="arrow-warn" marker-end="url(#arr-warn)"/>
<text x="842" y="598" class="edge-warn">Sim</text>

<rect x="680" y="618" width="296" height="90" rx="12" fill="#ffffff" stroke="#c99846" stroke-width="1.5"/>
<text x="698" y="646" class="card-title">Contingência remota</text>
<text x="698" y="669" class="card-sub">Pausar sessão, acionar canal de</text>
<text x="698" y="689" class="card-sub">contato e migrar à sala reserva.</text>

<line x1="680" y1="663" x2="624" y2="663" class="arrow-warn" marker-end="url(#arr-warn)"/>

<!-- Decisão 3: Conexão estabilizou? -->
<polygon points="518,616 620,663 518,710 416,663" fill="#fffaf0" stroke="#c99846" stroke-width="2"/>
<text x="518" y="659" text-anchor="middle" class="diamond-txt">Conexão</text>
<text x="518" y="679" text-anchor="middle" class="diamond-txt">estabilizou?</text>

<!-- Sim -> retoma UT -->
<line x1="518" y1="616" x2="518" y2="572" class="arrow-loop" marker-end="url(#arr-loop)"/>
<text x="530" y="598" class="edge-loop">Sim (retoma)</text>

<!-- Não -> Reagendar sessão -->
<line x1="416" y1="663" x2="360" y2="663" class="arrow-warn" marker-end="url(#arr-warn)"/>
<text x="388" y="654" text-anchor="middle" class="edge-warn">Não</text>

<rect x="72" y="618" width="284" height="90" rx="12" fill="#ffffff" stroke="#c99846" stroke-width="1.5"/>
<text x="90" y="646" class="card-title">Reagendar sessão</text>
<text x="90" y="669" class="card-sub">Registrar interrupção; reagendar</text>
<text x="90" y="689" class="card-sub">ou registrar uso presencial.</text>

<!-- Linha 3: Regra de validade + Retorno UT08 -->
<rect x="72" y="742" width="760" height="88" rx="12" fill="#f3fbf7" stroke="#8ec0ab" stroke-width="1.5"/>
<text x="90" y="768" class="note-b">Regras para interrupções e retorno</text>
<text x="90" y="792" class="note">Falha após exposição à tarefa: marcar tentativa como não avaliável e retomada como exploratória.</text>
<text x="90" y="813" class="note">Registrar ausência por pessoa; MU08 fica não avaliada só se ninguém do perfil retornar em condição válida.</text>

<!-- Passo 7 -> Passo 8 (Retorno) -->
<line x1="1163" y1="568" x2="1163" y2="738" class="arrow-ext" marker-end="url(#arr-warn)"/>
<text x="1176" y="660" class="edge-warn">≥ 7 dias sem uso</text>

<rect x="862" y="742" width="466" height="88" rx="12" fill="#fffaf0" stroke="#d0ac70" stroke-width="2" stroke-dasharray="8 6"/>
<text x="880" y="769" class="card-title">8. Sessão de retorno (UT08 · MU08)</text>
<text x="880" y="793" class="card-sub">Confirmar intervalo sem uso, executar as 3 partes de UT08 e</text>
<text x="880" y="813" class="card-sub">salvar fichas pseudonimizadas na pasta privada da equipe.</text>

<!-- Transição Fase 2 -> Fase 3 -->
<line x1="700" y1="850" x2="700" y2="884" class="arrow" marker-end="url(#arr)"/>

<!-- FASE 3: INTERPRETAÇÃO E CONSOLIDAÇÃO -->
<rect x="50" y="888" width="1300" height="164" rx="14" fill="#edf4f8" stroke="#c8d9e6" stroke-width="1.5"/>
<text x="72" y="914" class="phase-team">FASE 3 · INTERPRETAÇÃO E CONSOLIDAÇÃO · EQUIPE</text>

<rect x="72" y="932" width="388" height="100" rx="12" fill="#ffffff" stroke="#b8ccd9" stroke-width="1.5"/>
<text x="90" y="960" class="card-title">9. Conferir fichas e gabaritos</text>
<text x="90" y="984" class="card-sub">Validar CSVs/MP4s salvos, tempos</text>
<text x="90" y="1005" class="card-sub">ajustados e classificação das tentativas.</text>

<line x1="460" y1="982" x2="502" y2="982" class="arrow" marker-end="url(#arr)"/>

<rect x="506" y="932" width="388" height="100" rx="12" fill="#ffffff" stroke="#b8ccd9" stroke-width="1.5"/>
<text x="524" y="960" class="card-title">10. Consolidar por tarefa e perfil</text>
<text x="524" y="984" class="card-sub">Calcular taxas (n/N), medianas e metas</text>
<text x="524" y="1005" class="card-sub">separando P01, P03 e eventuais proxies.</text>

<line x1="894" y1="982" x2="936" y2="982" class="arrow" marker-end="url(#arr)"/>

<rect x="940" y="932" width="388" height="100" rx="12" fill="#ffffff" stroke="#b8ccd9" stroke-width="1.5"/>
<text x="958" y="960" class="card-title">11. Cruzar com a Entrega 13</text>
<text x="958" y="984" class="card-sub">Comparar achados da observação (AU*)</text>
<text x="958" y="1005" class="card-sub">com violações da heurística (HC*).</text>

<!-- Transição Fase 3 -> Fase 4 -->
<line x1="700" y1="1052" x2="700" y2="1086" class="arrow" marker-end="url(#arr)"/>

<!-- FASE 4: RELATO DOS RESULTADOS E PRIVACIDADE -->
<rect x="50" y="1090" width="1300" height="174" rx="14" fill="#edf4f8" stroke="#c8d9e6" stroke-width="1.5"/>
<text x="72" y="1116" class="phase-team">FASE 4 · PRIVACIDADE, RELATO DOS RESULTADOS E DESCARTE · EQUIPE</text>

<rect x="72" y="1134" width="388" height="110" rx="12" fill="#ffffff" stroke="#b8ccd9" stroke-width="1.5"/>
<text x="90" y="1162" class="card-title">12. Retirada e gravações brutas</text>
<text x="90" y="1186" class="card-sub">Respeitar retirada (≤ 30 d, antes da</text>
<text x="90" y="1206" class="card-sub">consolidação pública, incl. trechos)</text>
<text x="90" y="1226" class="card-sub">e apagar gravações brutas (≤ 30 d).</text>

<line x1="460" y1="1189" x2="502" y2="1189" class="arrow" marker-end="url(#arr)"/>

<rect x="506" y="1134" width="388" height="110" rx="12" fill="#ffffff" stroke="#b8ccd9" stroke-width="1.5"/>
<text x="524" y="1162" class="card-title">13. Relatório e vídeo restrito</text>
<text x="524" y="1186" class="card-sub">Publicar síntese desidentificada,</text>
<text x="524" y="1206" class="card-sub">link restrito do vídeo (autorizado ou</text>
<text x="524" y="1226" class="card-sub">reencenado) e atualizar rastreabilidade.</text>

<line x1="894" y1="1189" x2="936" y2="1189" class="arrow" marker-end="url(#arr)"/>

<rect x="940" y="1134" width="388" height="110" rx="12" fill="#ffffff" stroke="#b8ccd9" stroke-width="1.5"/>
<text x="958" y="1162" class="card-title">14. Descarte ético final</text>
<text x="958" y="1186" class="card-sub">Remover contatos após retornos;</text>
<text x="958" y="1206" class="card-sub">apagar vídeo e registros privados em</text>
<text x="958" y="1226" class="card-sub">até 90 dias após o fim da disciplina.</text>

<!-- Rodapé -->
<text x="50" y="1296" class="note">Fonte: elaboração da Equipe 16 com base em Barbosa e Silva (2010), Teste de Usabilidade por Observação (slides 5–16), palestra de Felipe Melo e plano DECIDE (Entrega 12).</text>
</svg>
