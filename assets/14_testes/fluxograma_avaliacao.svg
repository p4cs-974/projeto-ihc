<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1060" viewBox="0 0 1000 1060" role="img" aria-labelledby="title desc">
<title id="title">Avaliação por observação: execução e fechamento</title>
<desc id="desc">Plano, sessão EXP01, higienização, análise qualitativa, comparação com a inspeção e relatório final. Piloto, três sessões estruturadas, retorno e métricas não realizados.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 Z" fill="#475569"/></marker></defs>
<rect width="1000" height="1060" fill="#fff"/>
<g font-family="DejaVu Sans,Arial,sans-serif" fill="#0f172a">
<text x="500" y="47" text-anchor="middle" font-size="26" font-weight="bold">Observação de uso: percurso executado</text>
<text x="500" y="78" text-anchor="middle" font-size="17">Equipe 16 · fechamento com escopo reduzido · 25/11/2026</text>
<rect x="60" y="108" width="880" height="88" rx="12" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="500" y="142" text-anchor="middle" font-size="21" font-weight="bold">Plano DECIDE documentado</text>
<text x="500" y="171" text-anchor="middle" font-size="16">Metas, tarefas e instrumentos definidos antes da avaliação.</text>
<line x1="500" y1="197" x2="500" y2="218" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="224" width="880" height="88" rx="12" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="500" y="258" text-anchor="middle" font-size="21" font-weight="bold">Sessão exploratória EXP01 · 24/11/2026</text>
<text x="500" y="287" text-anchor="middle" font-size="16">Uma pessoa externa · exploração guiada · único vídeo de 06:44.</text>
<line x1="500" y1="313" x2="500" y2="334" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="340" width="880" height="88" rx="12" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="500" y="374" text-anchor="middle" font-size="21" font-weight="bold">Higienização das evidências</text>
<text x="500" y="403" text-anchor="middle" font-size="16">Transcrição anonimizada e 39 quadros limpos; vídeo bruto fora do Git.</text>
<line x1="500" y1="429" x2="500" y2="450" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="456" width="880" height="88" rx="12" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="500" y="490" text-anchor="middle" font-size="21" font-weight="bold">Análise qualitativa da sessão</text>
<text x="500" y="519" text-anchor="middle" font-size="16">Linha do tempo e nove achados AU01–AU09; indicadores não medidos.</text>
<line x1="500" y1="545" x2="500" y2="566" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="572" width="880" height="88" rx="12" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="500" y="606" text-anchor="middle" font-size="21" font-weight="bold">Comparação com a inspeção heurística</text>
<text x="500" y="635" text-anchor="middle" font-size="16">Três avaliadores · 33 achados HC01–HC33 · mesma versão 7405221.</text>
<line x1="500" y1="661" x2="500" y2="682" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="688" width="880" height="88" rx="12" fill="#ecfdf5" stroke="#94a3b8" stroke-width="1.5"/>
<text x="500" y="722" text-anchor="middle" font-size="21" font-weight="bold">Relatório final e recomendações · 25/11/2026</text>
<text x="500" y="751" text-anchor="middle" font-size="16">Coleta encerrada; melhorias propostas, sem implementação ou reavaliação.</text>
<rect x="60" y="808" width="880" height="158" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="500" y="842" text-anchor="middle" font-size="20" font-weight="bold" fill="#9a3412">Planejado, mas não realizado nesta entrega</text>
<text x="500" y="874" text-anchor="middle" font-size="17" font-weight="normal" fill="#9a3412">PIL01 · sessões estruturadas U01–U03 · retorno UT08 após sete dias</text>
<text x="500" y="904" text-anchor="middle" font-size="17" font-weight="normal" fill="#9a3412">MU01–MU08 sem medição válida · perfil profissional não verificado</text>
<text x="500" y="934" text-anchor="middle" font-size="17" font-weight="normal" fill="#9a3412">Amostra mínima não atendida; dispensa docente não registrada.</text>
<text x="500" y="1008" text-anchor="middle" font-size="16">Consentimento e acesso audiovisual: ver registro específico na Entrega 14.</text>
<text x="500" y="1036" text-anchor="middle" font-size="15" fill="#475569">Nenhuma nova sessão ou gravação integra o fechamento desta rodada.</text>
</g></svg>
