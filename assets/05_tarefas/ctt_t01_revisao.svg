  <title id="ctt-title">Diagrama CTT — Tarefa T01, revisão de uma partida concluída no uso proposto</title>
  <desc id="ctt-desc">Modelo ConcurTaskTrees da revisão de uma partida concluída por Rafael (P01): abrir resultados, revisar cada corte com prévia, atender a supervisão com suspensão e retomada, conferir cobertura, baixar a seleção, recuperar omissões no editor externo e entregar a seleção.</desc>
