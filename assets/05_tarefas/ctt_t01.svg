    <text x="90.0" y="50.0" class="legend-item" font-weight="700">Habilitação:</text>
    <text x="375.0" y="50.0" class="legend-item">Enviar as partidas libera o acompanhamento; o aviso de falha libera a consulta do motivo.</text>
