<text x="540" y="315" text-anchor="middle" font-size="16" font-weight="400" fill="#222">2. Inspecionar seleção</text>
<text x="540" y="337" text-anchor="middle" font-size="16" font-weight="400" fill="#222">e contexto dos cortes</text>
<text x="540" y="370" text-anchor="middle" font-size="14" font-weight="700" fill="#222">2.1 &gt; 2.2 &gt; 2.3</text>
