<text x="720" y="150" text-anchor="middle" font-size="16" font-weight="400" fill="#222">0. Supervisionar processo editorial</text>
<text x="720" y="172" text-anchor="middle" font-size="16" font-weight="400" fill="#222">e chancelar cortes</text>
<text x="720" y="209" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Plano 0: 1 &gt; 2 &gt; 3; se houver contingência, executar 4</text>
