<text x="1260" y="370" text-anchor="middle" font-size="14" font-weight="700" fill="#222">4.1 &gt; 4.2 &gt; 4.3 &gt; 4.4</text>
<text x="40" y="416" text-anchor="start" font-size="16" font-weight="400" fill="#222">Abaixo: detalhamento dos mesmos objetivos 1–4 da visão geral.</text>
