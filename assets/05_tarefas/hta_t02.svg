<text x="180" y="315" text-anchor="middle" font-size="16" font-weight="400" fill="#222">1. Identificar e priorizar</text>
<text x="180" y="337" text-anchor="middle" font-size="16" font-weight="400" fill="#222">lote recebido</text>
<text x="180" y="370" text-anchor="middle" font-size="14" font-weight="700" fill="#222">1.1 &gt; 1.2 &gt; 1.3</text>
